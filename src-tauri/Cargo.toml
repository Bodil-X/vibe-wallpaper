[package]
name = "vibe-wallpaper"
version = "0.1.0"
description = "A Tauri App"
authors = ["Bodil"]
license = "MIT"
homepage = "https://vibe-wallpaper.bodil.cn"
repository = "https://github.com/Bodil-X/vibe-wallpaper"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 修复 Windows 特定的构建问题
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "wry", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 使用轻量级的 HTTP 客户端减少依赖
ureq = { version = "2.10", features = ["json", "native-certs"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
winapi = { version = "0.3", features = ["winuser", "wingdi", "winnt", "minwindef", "wincon", "shellapi"] }
winreg = "0.52"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"

